<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>누르하치의 이동 — 보간 재생 시연</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body{margin:0;height:100%;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;}
  #map{position:absolute;inset:0;}
  #panel{
    position:absolute;left:16px;bottom:16px;z-index:1000;
    background:rgba(255,255,255,.95);border:1px solid #cfccc4;border-radius:8px;
    padding:14px 16px;min-width:340px;box-shadow:0 2px 12px rgba(0,0,0,.18);
  }
  #head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;}
  #ym{font-size:20px;font-weight:700;color:#1a1a18;font-variant-numeric:tabular-nums;}
  #name{font-size:15px;color:#555;}
  #row{display:flex;align-items:center;gap:10px;}
  button{
    width:38px;height:34px;border:1px solid #b9b6ad;background:#fff;border-radius:5px;
    cursor:pointer;font-size:14px;line-height:1;
  }
  button:hover{background:#f2f0ec;}
  #slider{flex:1;}
  #opts{margin-top:10px;font-size:12px;color:#666;display:flex;gap:14px;flex-wrap:wrap;}
  #opts label{cursor:pointer;}
  select{font-size:12px;}
</style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <div id="head"><span id="ym">—</span><span id="name"></span></div>
  <div id="row">
    <button id="play" title="재생/정지">▶</button>
    <button id="reset" title="처음으로">↺</button>
    <input id="slider" type="range" min="0" value="0" step="1">
  </div>
  <div id="opts">
    <label>속도
      <select id="speedSel">
        <option value="2400">느리게</option>
        <option value="1400" selected>보통</option>
        <option value="700">빠르게</option>
      </select>
    </label>
    <label>가감속
      <select id="easeSel">
        <option value="easeInOut" selected>완급</option>
        <option value="linear">등속</option>
        <option value="easeOut">급출발</option>
      </select>
    </label>
    <label><input type="checkbox" id="followChk" checked> 시점 따라가기</label>
    <label><input type="checkbox" id="speedChk"> 거리비례 속도</label>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./nurhaci-move.js"></script>
<script>
// ── 시연용 더미 데이터 (실제 좌표·일정 아님, 동작 확인용) ──────────────
const timeline = [
  { ym:'1618-03', lat:41.721, lng:125.015, name:'赫圖阿拉' },
  { ym:'1618-04', lat:41.880, lng:124.120, name:'撫順' },
  { ym:'1618-05', lat:41.880, lng:124.120, name:'撫順' },
  { ym:'1618-06', lat:41.721, lng:125.015, name:'赫圖阿拉' },
  { ym:'1618-07', lat:41.721, lng:125.015, name:'赫圖阿拉' },
  { ym:'1619-03', lat:41.950, lng:124.560, name:'薩爾滸' },
  { ym:'1619-06', lat:42.290, lng:125.700, name:'開原' },
  { ym:'1619-07', lat:42.540, lng:125.330, name:'鐵嶺' },
  { ym:'1621-03', lat:41.270, lng:123.170, name:'遼陽' },
  { ym:'1621-04', lat:41.270, lng:123.170, name:'遼陽' },
  { ym:'1625-03', lat:41.805, lng:123.432, name:'瀋陽' }
];

const map = L.map('map', { zoomControl:true }).setView([41.8,124.3], 8);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; OpenStreetMap, &copy; CARTO', maxZoom:18
}).addTo(map);

// 전체 경유지를 옅은 점으로 미리 깔아둔다
timeline.forEach(p => L.circleMarker([p.lat,p.lng], {
  radius:3.5, color:'#8a8a84', weight:1, fillColor:'#fff', fillOpacity:1
}).addTo(map));

const khan = L.marker([timeline[0].lat, timeline[0].lng], {
  icon: L.divIcon({
    className:'', iconSize:[22,22], iconAnchor:[11,11],
    html:'<div style="width:22px;height:22px;border-radius:50%;background:#b03a2e;'+
         'border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45);"></div>'
  })
}).addTo(map);

const $ = id => document.getElementById(id);
$('slider').max = timeline.length - 1;

let anim;
function build() {
  if (anim) anim.pause();
  if (anim && anim.trailLine) map.removeLayer(anim.trailLine);
  anim = new MoveAnimator(map, timeline, {
    marker: khan,
    stepDuration: +$('speedSel').value,
    holdDuration: 450,
    easing: $('easeSel').value,
    followView: $('followChk').checked,
    constantSpeed: $('speedChk').checked,
    onStep: (i,p) => {
      $('ym').textContent = p.ym;
      $('name').textContent = p.name;
      $('slider').value = i;
    },
    onEnd: () => { $('play').textContent = '▶'; }
  });
}
build();

$('play').onclick = () => {
  anim.toggle();
  $('play').textContent = anim.playing ? '❚❚' : '▶';
};
$('reset').onclick = () => { anim.reset(); $('play').textContent = '▶'; };
$('slider').oninput = e => { anim.seek(+e.target.value); $('play').textContent = '▶'; };
['speedSel','easeSel','followChk','speedChk'].forEach(id => {
  $(id).onchange = () => { build(); $('play').textContent = '▶'; };
});
</script>
</body>
</html>
